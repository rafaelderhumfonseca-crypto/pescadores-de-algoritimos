<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Cadastro de Cliente</title>
        <link rel="stylesheet" href="../css/cadastro.css">
    </head>
    <body>
        <div class="login-container">
            <h2>Criar Conta</h2>
            <form action="../php/cadastro.php" method="POST">
                <input type="text" name="nome" placeholder="Nome Completo" required>
                <input type="email" name="gmail" placeholder="Seu Gmail" required>
                <input type="password" name="senha" placeholder="Sua Senha" required>
                <input type="text" name="telefone" placeholder="Telefone (Opcional)">
                <button type="submit">Cadastrar</button>
                
                <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                    Já possui uma conta? <br>
                    <a href="login.html" style="color: #28a745; text-decoration: none; font-weight: bold;">Faça login</a>
                </p>
            </form>
        </div>
    </body>
</html>
