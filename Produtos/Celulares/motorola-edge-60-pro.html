<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Motorola Edge 60 Pro - Nexus Store</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1686/1686306.png">
</head>
<body>

<header>
   <div class="logo">
        ⚔️ 💎 NEXUS <span class="destaque-store">STORE 💎 ⚔️</span>
    </div>
</header>

<main class="produto">

    <section class="galeria">
        <img src="https://imgs.extra.com.br/55069561/2g.png?imwidth=500" class="principal" alt="Motorola Edge 60 Pro">
    </section>

    <section class="informacoes">

        <h1>Motorola Edge 60 Pro</h1>

        <div class="avaliacao">
            <span>★★★★★</span>
        </div>

        <div class="preco">
            R$ 3.000,00
        </div>

        <div class="quantidade">
            <label>Quantidade</label>

            <div class="contador">
                <button type="button" onclick="alterarQuantidade(-1)">-</button>
                <input id="quantidade" type="text" value="1" readonly>
                <button type="button" onclick="alterarQuantidade(1)">+</button>
            </div>
        </div>

        <button class="comprar" type="button" onclick="comprarAgora()">
            Comprar Agora
        </button>

        <p>
            <br><br><br><br>
            Informacoes: O Motorola Edge 60 Pro combina design premium, tela de alta qualidade, cameras avancadas e bom desempenho. Com 5G e bateria de longa duracao, ele atende bem a jogos, redes sociais, videos e multitarefa.
            <br>
        </p>

    </section>

</main>

<script>
function alterarQuantidade(valor) {
    const campo = document.getElementById("quantidade");
    let quantidade = parseInt(campo.value) + valor;

    if (quantidade < 1) {
        quantidade = 1;
    }

    campo.value = quantidade;
}

function comprarAgora() {
    const quantidade = document.getElementById("quantidade").value;
    alert("Produto: Motorola Edge 60 Pro\\nQuantidade: " + quantidade + "\\nValor unitario: R$ 3.000,00");
}
</script>

</body>
</html>
