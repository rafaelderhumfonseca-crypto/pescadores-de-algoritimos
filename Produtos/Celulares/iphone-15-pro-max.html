<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iPhone 15 Pro Max - Nexus Store</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1686/1686306.png">
</head>
<body>

<header>
     <div class="logo">
        ⚔️ 💎 NEXUS <span class="destaque-store">STORE 💎 ⚔️</span>
    </div>
</header>

<main class="produto">

    <section class="galeria">
        <img src="https://www.iplacecorp.com.br/ccstore/v1/images/?source=/file/v3192512432927761115/products/226688.00-apple-iphone-15-pro-max-de-256gb-titanio-natural-mu7a3be-a.jpg&height=475&width=475" class="principal" alt="iPhone 15 Pro Max">
    </section>

    <section class="informacoes">

        <h1>iPhone 15 Pro Max</h1>

        <div class="avaliacao">
            <span>★★★★★</span>
        </div>

        <div class="preco">
            R$ 4.700,00
        </div>

        <div class="quantidade">
            <label>Quantidade</label>

            <div class="contador">
                <button type="button" onclick="alterarQuantidade(-1)">-</button>
                <input id="quantidade" type="text" value="1" readonly>
                <button type="button" onclick="alterarQuantidade(1)">+</button>
            </div>
        </div>

        <button class="comprar" type="button" onclick="comprarAgora()">
            Comprar Agora
        </button>

        <p>
            <br><br><br><br>
            Informacoes: O iPhone 15 Pro Max e um modelo premium da Apple com tela de alta qualidade, chip potente, cameras avancadas e suporte a 5G. O aparelho oferece excelente desempenho para jogos, fotografia, videos e aplicativos exigentes.
            <br>
        </p>

    </section>

</main>

<script>
function alterarQuantidade(valor) {
    const campo = document.getElementById("quantidade");
    let quantidade = parseInt(campo.value) + valor;

    if (quantidade < 1) {
        quantidade = 1;
    }

    campo.value = quantidade;
}

function comprarAgora() {
    const quantidade = document.getElementById("quantidade").value;
    alert("Produto: iPhone 15 Pro Max\\nQuantidade: " + quantidade + "\\nValor unitario: R$ 4.700,00");
}
</script>

</body>
</html>
