<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xiaomi 17T Pro - Nexus Store</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1686/1686306.png">
</head>
<body>

<header>
    <div class="logo">
        ⚔️ 💎 NEXUS <span class="destaque-store">STORE 💎 ⚔️</span>
    </div>
</header>

<main class="produto">

    <section class="galeria">
        <img src="https://dcdn-us.mitiendanube.com/stores/003/772/365/products/xiaomi_17t_pro_deep_blue_2_1-24cf609da2b641787617850154453603-480-0.webp" class="principal" alt="Xiaomi 17T Pro">
    </section>

    <section class="informacoes">

        <h1>Xiaomi 17T Pro</h1>

        <div class="avaliacao">
            <span>★★★★★</span>
        </div>

        <div class="preco">
            R$ 4.000,00
        </div>

        <div class="quantidade">
            <label>Quantidade</label>

            <div class="contador">
                <button type="button" onclick="alterarQuantidade(-1)">-</button>
                <input id="quantidade" type="text" value="1" readonly>
                <button type="button" onclick="alterarQuantidade(1)">+</button>
            </div>
        </div>

        <button class="comprar" type="button" onclick="comprarAgora()">
            Comprar Agora
        </button>

        <p>
            <br><br><br><br>
            Informacoes: O Xiaomi 17T Pro e um smartphone de alto desempenho com tela de alta qualidade, processador potente, cameras avancadas e bateria de longa duracao. E indicado para quem busca velocidade em jogos, aplicativos e multitarefa.
            <br>
        </p>

    </section>

</main>

<script>
function alterarQuantidade(valor) {
    const campo = document.getElementById("quantidade");
    let quantidade = parseInt(campo.value) + valor;

    if (quantidade < 1) {
        quantidade = 1;
    }

    campo.value = quantidade;
}

function comprarAgora() {
    const quantidade = document.getElementById("quantidade").value;
    alert("Produto: Xiaomi 17T Pro\\nQuantidade: " + quantidade + "\\nValor unitario: R$ 4.000,00");
}
</script>

</body>
</html>
