<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Last of Us Part I / Part II - Nexus Store</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1686/1686306.png">
</head>
<body>

<header>
    <div class="logo">
        ⚔️ 💎 NEXUS <span class="destaque-store">STORE 💎 ⚔️</span>
    </div>
</header>

<main class="produto">

    <section class="galeria">
        <img src="https://img.hype.games/cdn/31899bf8-52f5-469a-a201-6117e3340d10[Nexway]-UNCHARTED-Legacy-of-Thieves-Collection_Cover.png" class="principal" alt="The Last of Us Part I / Part II">
    </section>

    <section class="informacoes">

        <h1>The Last of Us Part I / Part II</h1>

        <div class="avaliacao">
            <span>★★★★★</span>
        </div>

        <div class="preco">
            R$ 298
        </div>

        <div class="quantidade">
            <label>Quantidade</label>

            <div class="contador">
                <button type="button" onclick="alterarQuantidade(-1)">-</button>
                <input id="quantidade" type="text" value="1" readonly>
                <button type="button" onclick="alterarQuantidade(1)">+</button>
            </div>
        </div>

        <button class="comprar" type="button" onclick="comprarAgora()">
            Comprar Agora
        </button>

        <p>
            <br><br><br><br>
            Informacoes: The Last of Us Part I e Part II apresentam uma historia de acao e sobrevivencia em um mundo devastado. Os jogos combinam exploracao, combate, furtividade e uma narrativa focada nos personagens e suas escolhas.
            <br>
        </p>

    </section>

</main>

<script>
function alterarQuantidade(valor) {
    const campo = document.getElementById("quantidade");
    let quantidade = parseInt(campo.value) + valor;

    if (quantidade < 1) {
        quantidade = 1;
    }

    campo.value = quantidade;
}

function comprarAgora() {
    const quantidade = document.getElementById("quantidade").value;
    alert("Produto: The Last of Us Part I / Part II\\nQuantidade: " + quantidade + "\\nValor unitario: R$ 298");
}
</script>

</body>
</html>
