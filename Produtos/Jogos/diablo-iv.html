<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diablo IV - Nexus Store</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1686/1686306.png">
</head>
<body>

<header>
    <div class="logo">
        ⚔️ 💎 NEXUS <span class="destaque-store">STORE 💎 ⚔️</span>
    </div>
</header>

<main class="produto">

    <section class="galeria">
        <img src="https://store-images.s-microsoft.com/image/apps.34975.14390077607010559.e12d5d17-66c1-4b75-8d9c-0b9c97813cd7.843dca64-f531-4b7d-81f2-e3905d7fe024" class="principal" alt="Diablo IV">
    </section>

    <section class="informacoes">

        <h1>Diablo IV</h1>

        <div class="avaliacao">
            <span>★★★★★</span>
        </div>

        <div class="preco">
            R$ 78
        </div>

        <div class="quantidade">
            <label>Quantidade</label>

            <div class="contador">
                <button type="button" onclick="alterarQuantidade(-1)">-</button>
                <input id="quantidade" type="text" value="1" readonly>
                <button type="button" onclick="alterarQuantidade(1)">+</button>
            </div>
        </div>

        <button class="comprar" type="button" onclick="comprarAgora()">
            Comprar Agora
        </button>

        <p>
            <br><br><br><br>
            Informacoes: Diablo IV e um RPG de acao com combate em tempo real, exploracao, equipamentos e habilidades. O jogador enfrenta hordas de inimigos, derrota chefes e evolui seu personagem em um mundo sombrio.
            <br>
        </p>

    </section>

</main>

<script>
function alterarQuantidade(valor) {
    const campo = document.getElementById("quantidade");
    let quantidade = parseInt(campo.value) + valor;

    if (quantidade < 1) {
        quantidade = 1;
    }

    campo.value = quantidade;
}

function comprarAgora() {
    const quantidade = document.getElementById("quantidade").value;
    alert("Produto: Diablo IV\\nQuantidade: " + quantidade + "\\nValor unitario: R$ 78");
}
</script>

</body>
</html>
