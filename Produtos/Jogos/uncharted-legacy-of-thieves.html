<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uncharted: Legacy of Thieves - Nexus Store</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1686/1686306.png">
</head>
<body>

<header>
    <div class="logo">
        ⚔️ 💎 NEXUS <span class="destaque-store">STORE 💎 ⚔️</span>
    </div>
</header>

<main class="produto">

    <section class="galeria">
        <img src="https://imgproxy.eneba.games/VyYcGvHYaAhgX4MrUWAcjx2HI5U7X2pcPHiAcijHneg/rs:fit:300/ar:1/czM6Ly9wcm9kdWN0/cy5lbmViYS5nYW1l/cy9wcm9kdWN0cy9o/emFQWTZqWUFNVkhf/am51aENKMmtnWkpQ/SGVoMUNHUElMQ1dX/R1JqY1NZLmpwZw" class="principal" alt="Uncharted: Legacy of Thieves">
    </section>

    <section class="informacoes">

        <h1>Uncharted: Legacy of Thieves</h1>

        <div class="avaliacao">
            <span>★★★★★</span>
        </div>

        <div class="preco">
            R$ 100
        </div>

        <div class="quantidade">
            <label>Quantidade</label>

            <div class="contador">
                <button type="button" onclick="alterarQuantidade(-1)">-</button>
                <input id="quantidade" type="text" value="1" readonly>
                <button type="button" onclick="alterarQuantidade(1)">+</button>
            </div>
        </div>

        <button class="comprar" type="button" onclick="comprarAgora()">
            Comprar Agora
        </button>

        <p>
            <br><br><br><br>
            Informacoes: Uncharted: Legacy of Thieves Collection reune aventuras de acao com exploracao, tiroteios, enigmas e uma historia cinematografica. O jogador acompanha aventuras em diferentes locais e cenarios.
            <br>
        </p>

    </section>

</main>

<script>
function alterarQuantidade(valor) {
    const campo = document.getElementById("quantidade");
    let quantidade = parseInt(campo.value) + valor;

    if (quantidade < 1) {
        quantidade = 1;
    }

    campo.value = quantidade;
}

function comprarAgora() {
    const quantidade = document.getElementById("quantidade").value;
    alert("Produto: Uncharted: Legacy of Thieves\\nQuantidade: " + quantidade + "\\nValor unitario: R$ 100");
}
</script>

</body>
</html>
