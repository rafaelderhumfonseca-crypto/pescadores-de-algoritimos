<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Call of Duty: Warzone - Nexus Store</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1686/1686306.png">
</head>
<body>

<header>
    <div class="logo">
        ⚔️ 💎 NEXUS <span class="destaque-store">STORE 💎 ⚔️</span>
    </div>
</header>

<main class="produto">

    <section class="galeria">
        <img src="https://i.ytimg.com/vi/TidXGyzxT8c/maxresdefault.jpg" class="principal" alt="Call of Duty: Warzone">
    </section>

    <section class="informacoes">

        <h1>Call of Duty: Warzone</h1>

        <div class="avaliacao">
            <span>★★★★★</span>
        </div>

        <div class="preco">
            R$ 40
        </div>

        <div class="quantidade">
            <label>Quantidade</label>

            <div class="contador">
                <button type="button" onclick="alterarQuantidade(-1)">-</button>
                <input id="quantidade" type="text" value="1" readonly>
                <button type="button" onclick="alterarQuantidade(1)">+</button>
            </div>
        </div>

        <button class="comprar" type="button" onclick="comprarAgora()">
            Comprar Agora
        </button>

        <p>
            <br><br><br><br>
            Informacoes: Call of Duty: Warzone e um jogo de tiro competitivo com modos de batalha e sobrevivencia. Os jogadores coletam equipamentos, enfrentam adversarios e precisam usar estrategia, movimentacao e precisao para vencer.
            <br>
        </p>

    </section>

</main>

<script>
function alterarQuantidade(valor) {
    const campo = document.getElementById("quantidade");
    let quantidade = parseInt(campo.value) + valor;

    if (quantidade < 1) {
        quantidade = 1;
    }

    campo.value = quantidade;
}

function comprarAgora() {
    const quantidade = document.getElementById("quantidade").value;
    alert("Produto: Call of Duty: Warzone\\nQuantidade: " + quantidade + "\\nValor unitario: R$ 40");
}
</script>

</body>
</html>
