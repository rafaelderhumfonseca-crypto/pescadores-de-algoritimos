<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Projeto de Algoritmos</title>
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <div class="login-container">
            <form action="login.php" method="POST" class="login-form">
                <h2>Login</h2>
                
                <div class="input-group">
                    <label for="user">Usuário (Nome) ou Telefone</label>
                    <input type="text" id="user" name="usuario" required>
                </div>

                <div class="input-group">
                    <label for="email">Gmail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="senha" required>
                </div>

                <button type="submit" name="entrar">Acessar</button>

                <p style="text-align: center; margin-top: 15px; font-size: 0.9rem;">
                    Não tem uma conta? <br>
                    <a href="cadastro.html" style="color: #007bff; text-decoration: none; font-weight: bold;">Cadastre-se aqui</a>
                </p>
            </form>
        </div>
    </body>
</html>
